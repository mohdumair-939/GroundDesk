# Render Blueprint for the FastAPI backend (Sprint 0.5).
# Secrets (sync: false) are entered in the Render dashboard, never committed.
services:
  - type: web
    name: smart-helpdesk-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /health
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.15
      - key: DATABASE_URL
        sync: false
      - key: CORS_ORIGINS
        sync: false
